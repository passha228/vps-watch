name: watch
# Внешний сторож: раз в 5 минут проверяет, что сервер принимает TCP на ssh-порт.
# Если сервер мёртв — шлёт алерт в Telegram. Секреты: IP, TOKEN, CHAT (опционально PORT).
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          IP: ${{ secrets.IP }}
          PORT: ${{ secrets.PORT || '22' }}
          TOKEN: ${{ secrets.TOKEN }}
          CHAT: ${{ secrets.CHAT }}
        run: |
          for i in 1 2 3; do timeout 5 bash -c "</dev/tcp/$IP/$PORT" && { echo up; exit 0; }; sleep 20; done
          for c in $CHAT; do
            curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$c" \
              --data-urlencode text="🔴 Сервер не отвечает (проверка из GitHub)"
          done
          exit 1
