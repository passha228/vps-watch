name: watch
# Внешний сторож, раз в 5 минут:
#  1) проверка из GitHub (за рубежом): сервер принимает TCP на ssh-порт?  нет → 🔴 сервер лёг
#  2) проверка из РФ через узлы check-host.net: тот же порт доступен?    нет → 🟠 IP заблокирован в РФ
# Секреты: IP, TOKEN, CHAT (опционально PORT).
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - env:
          IP: ${{ secrets.IP }}
          PORT: ${{ secrets.PORT || '22' }}
          TOKEN: ${{ secrets.TOKEN }}
          CHAT: ${{ secrets.CHAT }}
        run: |
          send(){ for c in $CHAT; do curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$c" --data-urlencode text="$1" >/dev/null; done; }

          up=0
          for i in 1 2 3; do timeout 5 bash -c "</dev/tcp/$IP/$PORT" && { up=1; break; }; sleep 20; done
          (( up )) || { send "🔴 Сервер не отвечает (проверка из-за рубежа)"; exit 1; }
          echo "из-за рубежа: up"

          CH=https://check-host.net; J='Accept: application/json'
          nodes=$(curl -s -H "$J" $CH/nodes/hosts | jq -r '.nodes | to_entries[]
            | select(.value.location[0] | ascii_downcase == "ru") | "&node=" + .key' | tr -d '\n')
          [[ -n $nodes ]] || { echo "check-host: нет узлов в РФ, пропуск"; exit 0; }
          id=$(curl -s -H "$J" "$CH/check-tcp?host=$IP:$PORT$nodes" | jq -r .request_id)
          sleep 20
          read -r fin ok < <(curl -s -H "$J" "$CH/check-result/$id" \
            | jq -r '[.[] | arrays | .[] | objects] | "\(length) \(map(select(.time)) | length)"')
          echo "из РФ: завершено $fin, успешно $ok"
          (( fin == 0 || ok > 0 )) || { send "🟠 Сервер жив, но из РФ недоступен — похоже, IP заблокирован"; exit 1; }